version: 1.6.0
schema_data_changes:
  entries:
  - models:
    - '[tiktok_ads__campaign_age_gender_report](https://fivetran.github.io/dbt_tiktok_ads/#!/model/model.tiktok_ads.tiktok_ads__campaign_age_gender_report)'
    change_type: New model
    new: Daily campaign performance by audience age range and gender
    is_breaking: false
    notes: Built from the `CAMPAIGN_AGE_GENDER_REPORT` source table. Splits `age`
      into `min_age` and `max_age`. A null `age` or `gender` becomes `UNKNOWN`.
  - models:
    - '[stg_tiktok_ads__campaign_age_gender_report](https://fivetran.github.io/dbt_tiktok_ads/#!/model/model.tiktok_ads.stg_tiktok_ads__campaign_age_gender_report)'
    - '[stg_tiktok_ads__campaign_age_gender_report_tmp](https://fivetran.github.io/dbt_tiktok_ads/#!/model/model.tiktok_ads.stg_tiktok_ads__campaign_age_gender_report_tmp)'
    change_type: New staging model
    is_breaking: false
    notes: Enabled by default. Disable with the `tiktok_ads__using_campaign_age_gender_report`
      variable.
new_features:
- title: Campaign age and gender reporting variables
  description: Adds two variables for the new age and gender report.
  details:
  - '`tiktok_ads__using_campaign_age_gender_report` disables the new models if you
    don''t sync `CAMPAIGN_AGE_GENDER_REPORT`. It''s `true` by default and configured
    dynamically in Quickstart.'
  - '`tiktok_ads__campaign_age_gender_report_passthrough_metrics` passes additional
    `CAMPAIGN_AGE_GENDER_REPORT` metrics through to `tiktok_ads__campaign_age_gender_report`.'
date: '2026-11-02'
