version: 1.6.0
pr_number: 58
new_features:
- description: Raises the minimum supported dbt version from v1.3.0 to v1.10.0.
under_the_hood:
- description: Adds `dbt_utils.unique_combination_of_columns` tests to the staging and end models. The tests use the `arguments` syntax introduced in dbt v1.10.0, the new minimum supported version.
- title: Column documentation now matches staging model output
  description: Removes four column entries from `stg_tiktok_ads.yml` that the staging
    models do not output, so the package documentation reflects the columns you actually
    receive.
  details:
  - '`stg_tiktok_ads__advertiser`: removes `create_time`, `license_no`, and `license_url`.'
  - '`stg_tiktok_ads__campaign_history`: removes `opt_status`.'
