name: 'tiktok_ads_integration_tests'
version: '1.6.0'
profile: 'integration_tests'
config-version: 2

models:
  +persist_docs:
    relation: true
    columns: "{{ false if target.type in ('databricks') else true }}"
  +schema: "tiktok_ads_{{ var('directed_schema','dev') }}"

vars: 
  tiktok_ads:
    tiktok_ads_schema: tiktok_ads_integration_tests
    tiktok_ads_adgroup_history_identifier: "tiktok_adgroup_history_data"
    tiktok_ads_ad_history_identifier: "tiktok_ad_history_data"
    tiktok_ads_advertiser_identifier: "tiktok_advertiser_data"
    tiktok_ads_campaign_history_identifier: "tiktok_campaign_history_data"
    tiktok_ads_ad_report_hourly_identifier: "tiktok_ad_report_hourly_data"
    tiktok_ads_adgroup_report_hourly_identifier: "tiktok_adgroup_report_hourly_data"
    tiktok_ads_campaign_report_hourly_identifier: "tiktok_campaign_report_hourly_data"
    tiktok_ads_campaign_country_report_identifier: "tiktok_campaign_country_report_data"
    tiktok_ads_location_identifier: "tiktok_location_data"
    tiktok_ads_smart_plus_ad_history_identifier: "tiktok_smart_plus_ad_history_data"
    tiktok_ads_creative_history_identifier: "tiktok_creative_history_data"

  tiktok_ads__ad_group_hourly_passthrough_metrics:
    - name: total_purchase_value
    - name: total_sales_lead_value
      alias: total_sales_lead_value_aliased

seeds:
  +quote_columns: "{{ target.type == 'redshift' or var('fivetran_using_source_casing', false) }}"
  +docs:
    show: false
  tiktok_ads_integration_tests:
    tiktok_creative_history_data:
      +column_types:
        identity_id: "{{ 'string' if target.type in ('bigquery', 'databricks', 'spark') else 'varchar' }}"
    tiktok_smart_plus_ad_history_json_data:
      +enabled: "{{ target.type == 'redshift' and not var('fivetran_using_source_casing', false) }}"
      +column_types:
        landing_page_url_list_string: varchar
      # Fivetran syncs `landing_page_url_list` as SUPER on Redshift. Load as VARCHAR first, then convert to SUPER in a post-hook.
      +post-hook:
        - "alter table {{ this }} add column landing_page_url_list super default null"
        - "update {{ this }} set landing_page_url_list = json_parse(landing_page_url_list_string)"

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['spark_utils', 'dbt_utils']
flags:
  send_anonymous_usage_stats: False
  use_colors: True