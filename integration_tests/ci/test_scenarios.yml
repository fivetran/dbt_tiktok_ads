schema_variable_name: "tiktok_ads_schema"

include_databricks_sql: false
include_sqlserver: false
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "url filter disabled"
    vars:
      ad_reporting__url_report__using_null_filter: false
    include_incremental: false

  - name: "campaign country disabled"
    vars:
      tiktok_ads__using_campaign_country_report: false
    include_incremental: false